<h2 class="page-title">Provisioning Automation</h2>
<p class="page-subtitle">Select a task below to start an automation workflow.</p>

<div class="task-grid">

  <mat-card *ngFor="let task of tasks" (click)="goToTask(task.id)" class="task-card">
    <mat-card-header class="task-header">
      <div class="task-icon-container">
        <mat-icon class="task-icon">{{ task.icon }}</mat-icon>
      </div>
      <mat-card-title class="task-title">{{ task.title }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p class="task-desc">{{ task.desc }}</p>
    </mat-card-content>

    <div class="task-arrow">
      <mat-icon>arrow_forward</mat-icon>
    </div>
  </mat-card>

</div>
