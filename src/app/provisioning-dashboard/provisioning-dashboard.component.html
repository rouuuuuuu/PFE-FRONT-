<div class="page-header">
  <mat-icon class="header-icon">settings</mat-icon>
  <div>
    <h1 class="page-title">{{ 'PROV_DASH.TITLE' | translate }}</h1>
    <p class="page-subtitle">{{ 'PROV_DASH.SUBTITLE' | translate }}</p>
  </div>
</div>

<div class="task-grid">
  <mat-card *ngFor="let task of tasks" (click)="goToTask(task)" class="task-card">
    <mat-card-header class="task-header">
      <div class="task-icon-container">
        <mat-icon class="task-icon">{{ task.icon }}</mat-icon>
      </div>
      <mat-card-title class="task-title">{{ 'PROV_DASH.TASKS.' + task.id + '_TITLE' | translate }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p class="task-desc">{{ 'PROV_DASH.TASKS.' + task.id + '_DESC' | translate }}</p>
    </mat-card-content>

    <div class="task-arrow">
      <mat-icon>arrow_forward</mat-icon>
    </div>
  </mat-card>
</div>
